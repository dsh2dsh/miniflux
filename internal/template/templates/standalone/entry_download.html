<article class="entry-content feed-id-{{ .entry.FeedID }} download" lang="{{ .entry.Language }}" dir="auto">
    {{ if .unexpectedStatus }}
    <h3>{{ .unexpectedStatus }}</h3>
    <div role="alert" class="alert alert-error">
        <div>{{ .error }}</div>
    </div>
    <div>{{ .safeContent }}</div>
    {{ else }}
    {{ .safeContent }}
    {{ end }}
</article>
